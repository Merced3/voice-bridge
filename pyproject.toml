[project]
name = "voice-bridge"
version = "0.1.0"
description = "Transport-only voice channel over a phone/browser web page for all projects"
requires-python = ">=3.13"
dependencies = [
    "automation-harness",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic-settings>=2.5",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "websockets>=12",
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_bridge"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
