[project]
name = "voice-bridge"
version = "0.1.0"
description = "Transport-only voice channel over a phone/browser web page for all projects"
requires-python = ">=3.13"
dependencies = [
    "automation-harness",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic-settings>=2.5",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "websockets>=12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_bridge"]
